global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'scouter-monitor'

scrape_configs:
  - job_name: 'scouter'
    # Use Docker host gateway IP to access host machine
    static_configs:
      - targets: ['host.docker.internal:5001']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
